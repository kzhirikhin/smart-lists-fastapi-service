name: Scan deployed Cloud Run images

on:
  # Минуты намеренно не нулевые: GitHub предупреждает, что в начале часа
  # scheduled workflows чаще задерживаются из-за общей нагрузки.
  schedule:
    - cron: '17 3 * * 3'
  workflow_dispatch:
  # После merge policy-only PR проверяем тот же production digest автоматически.
  # Эти пути исключены из deploy.yml, поэтому exact-привязка не устаревает.
  push:
    branches:
      - main
    paths:
      - security/vex/**
      - security/waivers.json
      - scripts/evaluate_image_scan.py
      - scripts/verify_attestation_certificate.py
      - scripts/verify_image_evidence.py
      - .github/workflows/image-scan.yml

permissions:
  contents: read

# Повторный ручной запуск не отменяет уже начавшуюся проверку: иначе можно
# потерять отчёт как раз во время разбора инцидента.
concurrency:
  group: scan-deployed-cloud-run-images
  cancel-in-progress: false

env:
  PROJECT_ID: project-5b7c1bd1-572b-410d-826
  REGION: us-central1
  SERVICE: insights-api
  IMAGE: us-central1-docker.pkg.dev/project-5b7c1bd1-572b-410d-826/smart-lists/insights-api
  SCANNER_SA: github-image-scanner@project-5b7c1bd1-572b-410d-826.iam.gserviceaccount.com
  TRUSTED_WORKFLOW: kzhirikhin/smart-lists-fastapi-service/.github/workflows/deploy.yml
  TRUSTED_REPOSITORY_ID: '1199475908'
  GH_CLI_VERSION: 2.98.0
  # SHA-256 из официального gh_2.98.0_checksums.txt.
  GH_CLI_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de
  GRYPE_VERSION: 0.117.0
  # SHA-256 из официального grype_0.117.0_checksums.txt.
  GRYPE_SHA256: 38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26
  GRYPE_DB_AUTO_UPDATE: 'true'
  GRYPE_DB_VALIDATE_AGE: 'true'
  GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 120h
  GRYPE_DB_REQUIRE_UPDATE_CHECK: 'true'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/912709146180/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: ${{ env.SCANNER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Install Grype and require a fresh vulnerability database
        run: |
          archive="${RUNNER_TEMP}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            -o "${archive}"
          echo "${GRYPE_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "${archive}" -C /usr/local/bin grype
          grype db update
          grype db status

      # Источник истины — статус Cloud Run, а не последний тег в реестре.
      # Учитываются ревизии с ненулевым трафиком и tagged revisions: последние
      # доступны по отдельному URL даже при нулевом проценте общего трафика.
      - name: Resolve serving image digests
        id: targets
        run: |
          set -euo pipefail
          reports_dir="${RUNNER_TEMP}/grype-reports"
          mkdir -p "${reports_dir}"

          service_json="${RUNNER_TEMP}/cloud-run-service.json"
          gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json > "${service_json}"

          latest_ready="$(jq -r '.status.latestReadyRevisionName // empty' "${service_json}")"
          mapfile -t revisions < <(
            jq -r --arg latest "${latest_ready}" '
              (.status.traffic // [])[]
              | select(((.percent // 0) > 0) or (.tag != null))
              | if .revisionName then .revisionName
                elif .latestRevision == true then $latest
                else empty
                end
            ' "${service_json}" | sed '/^$/d' | sort -u
          )

          if (( ${#revisions[@]} == 0 )); then
            echo "::error::Cloud Run не вернул ни одной обслуживающей ревизии"
            exit 1
          fi

          targets_file="${RUNNER_TEMP}/cloud-run-image-targets.txt"
          : > "${targets_file}"
          for revision in "${revisions[@]}"; do
            image_ref="$(gcloud run revisions describe "${revision}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --format='value(spec.containers[0].image)')"
            prefix="${IMAGE}@sha256:"
            digest="${image_ref#"${prefix}"}"
            if [[ "${image_ref}" != "${prefix}"* || ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Ревизия ${revision} указывает не на ожидаемый immutable digest: ${image_ref}"
              exit 1
            fi
            printf '%s\n' "${image_ref}" >> "${targets_file}"
          done

          sort -u -o "${targets_file}" "${targets_file}"
          if [[ ! -s "${targets_file}" ]]; then
            echo "::error::Список image digest оказался пустым"
            exit 1
          fi

          # Cloud Run импортирует выбранный linux/amd64 manifest из OCI index и
          # показывает в revision уже дочерний digest. Attestation относится к
          # исходному index из build output. Находим ровно один tagged index,
          # который криптографически по digest включает каждый serving manifest.
          registry_json="${RUNNER_TEMP}/artifact-registry-images.json"
          gcloud artifacts docker images list "${IMAGE}" \
            --include-tags \
            --format=json > "${registry_json}"
          mapfile -t parent_digests < <(
            jq -r '
              .[]
              | select(.metadata.mediaType == "application/vnd.oci.image.index.v1+json")
              | select((.tags // []) | length > 0)
              | .version
            ' "${registry_json}" | sort -u
          )
          if (( ${#parent_digests[@]} == 0 )); then
            echo "::error::Artifact Registry не вернул ни одного tagged OCI index"
            exit 1
          fi

          provenance_targets="${RUNNER_TEMP}/cloud-run-provenance-targets.tsv"
          : > "${provenance_targets}"
          while IFS= read -r image_ref; do
            child_digest="${image_ref##*@}"
            matches=()
            for parent_digest in "${parent_digests[@]}"; do
              index_json="${RUNNER_TEMP}/oci-index-${parent_digest#sha256:}.json"
              docker buildx imagetools inspect "${IMAGE}@${parent_digest}" \
                --raw > "${index_json}"
              if jq -e --arg child "${child_digest}" '
                .mediaType == "application/vnd.oci.image.index.v1+json" and
                any(.manifests[];
                  .digest == $child and
                  .platform.os == "linux" and
                  .platform.architecture == "amd64"
                )
              ' "${index_json}" > /dev/null; then
                matches+=("${parent_digest}")
                cp "${index_json}" \
                  "${reports_dir}/provenance-link-${child_digest#sha256:}-${parent_digest#sha256:}.json"
              fi
            done
            if (( ${#matches[@]} != 1 )); then
              echo "::error::Для serving ${child_digest} найдено OCI parent index: ${#matches[@]}, ожидался ровно один"
              exit 1
            fi
            printf '%s\t%s@%s\n' "${image_ref}" "${IMAGE}" "${matches[0]}" \
              >> "${provenance_targets}"
          done < "${targets_file}"

          echo "targets_file=${targets_file}" >> "${GITHUB_OUTPUT}"
          echo "provenance_targets=${provenance_targets}" >> "${GITHUB_OUTPUT}"
          echo "reports_dir=${reports_dir}" >> "${GITHUB_OUTPUT}"

      # Deploy-time gate защищает момент выкладки, а эта проверка повторно
      # подтверждает происхождение каждой реально доступной Cloud Run revision.
      # Source SHA здесь намеренно не равен SHA текущего scan-run: serving image
      # мог быть собран более ранним push. Его ref, signer workflow и все
      # защищённые сертификатом claims при этом обязаны оставаться точными.
      - name: Verify provenance of every serving digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl -sSfL \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            -o "${archive}"
          echo "${GH_CLI_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          gh_bin="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
          [[ "$("${gh_bin}" --version | head -n 1)" == "gh version ${GH_CLI_VERSION} (2026-08-20)" ]]

          while IFS=$'\t' read -r serving_ref provenance_ref; do
            serving_digest="${serving_ref##*@}"
            provenance_digest="${provenance_ref##*@}"
            verification="${{ steps.targets.outputs.reports_dir }}/provenance-${provenance_digest#sha256:}.json"
            "${gh_bin}" attestation verify "oci://${provenance_ref}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${TRUSTED_WORKFLOW}" \
              --source-ref "refs/heads/main" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --deny-self-hosted-runners \
              --format json > "${verification}"

            jq -e \
              --arg image "${IMAGE}" \
              --arg digest "${provenance_digest#sha256:}" \
              --arg repository_id "${TRUSTED_REPOSITORY_ID}" \
              '
                length == 1 and
                all(.[];
                  .verificationResult.statement.predicateType ==
                    "https://slsa.dev/provenance/v1" and
                  (.verificationResult.statement.subject | length == 1) and
                  .verificationResult.statement.subject[0].name == $image and
                  .verificationResult.statement.subject[0].digest.sha256 == $digest and
                  (.verificationResult.verifiedTimestamps | length > 0) and
                  .verificationResult.signature.certificate.buildTrigger == "push" and
                  .verificationResult.signature.certificate.runnerEnvironment ==
                    "github-hosted" and
                  .verificationResult.signature.certificate.sourceRepositoryIdentifier ==
                    $repository_id
                )
              ' "${verification}" > /dev/null

            python scripts/verify_attestation_certificate.py \
              --verification "${verification}" \
              --environment production \
              --event push \
              --runner github-hosted \
              --repository-id "${TRUSTED_REPOSITORY_ID}"
            printf -- '### Provenance — `%s`\n\n- Attestation: **PASS**\n- Signer: `%s` from `refs/heads/main`\n\n' \
              "${provenance_digest}" "${TRUSTED_WORKFLOW}" >> "${GITHUB_STEP_SUMMARY}"
            printf -- '- Serving manifest: `%s` (linux/amd64 member of the signed OCI index)\n\n' \
              "${serving_digest}" >> "${GITHUB_STEP_SUMMARY}"
          done < "${{ steps.targets.outputs.provenance_targets }}"

      # Проверяем все обслуживающие digest, даже если первый уже уязвим.
      # Контейнер не запускается: inspect/create/export дают конфигурацию и
      # rootfs exact digest без сети, runtime identity и исполнения его кода.
      # Grype без `--fail-on` отличает техническую ошибку от результата, а
      # отдельный policy evaluator применяет только exact VEX/waiver и решает
      # high/critical gate. Ни техническую ошибку, ни провал evidence политика
      # подавить не может.
      - name: Scan every serving digest
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r image_ref; do
            digest="${image_ref##*@}"
            report_prefix="${{ steps.targets.outputs.reports_dir }}/grype-${digest#sha256:}"
            raw_report="${report_prefix}-raw.json"
            policy_report="${report_prefix}-policy.json"
            policy_summary="${report_prefix}-summary.md"
            evidence_report="${report_prefix}-evidence.json"
            inspect_json="${RUNNER_TEMP}/image-inspect-${digest#sha256:}.json"
            rootfs_tar="${RUNNER_TEMP}/image-rootfs-${digest#sha256:}.tar"

            container_id=""
            set +e
            docker pull "${image_ref}"
            evidence_code=$?
            if (( evidence_code == 0 )); then
              docker image inspect "${image_ref}" > "${inspect_json}"
              evidence_code=$?
            fi
            if (( evidence_code == 0 )); then
              container_id="$(docker create "${image_ref}")"
              evidence_code=$?
            fi
            if (( evidence_code == 0 )); then
              docker export --output "${rootfs_tar}" "${container_id}"
              evidence_code=$?
            fi
            if (( evidence_code == 0 )); then
              python scripts/verify_image_evidence.py \
                --inspect "${inspect_json}" \
                --rootfs-tar "${rootfs_tar}" \
                --image-ref "${image_ref}" \
                --image-digest "${digest}" \
                --output "${evidence_report}"
              evidence_code=$?
            fi
            if (( evidence_code != 0 )) && [[ ! -f "${evidence_report}" ]]; then
              # Даже ранний Docker-сбой оставляет машиночитаемый ERROR artifact.
              python scripts/verify_image_evidence.py \
                --inspect "${inspect_json}" \
                --rootfs-tar "${rootfs_tar}" \
                --image-ref "${image_ref}" \
                --image-digest "${digest}" \
                --output "${evidence_report}"
            fi
            if [[ -n "${container_id}" ]]; then
              docker rm -f "${container_id}" > /dev/null 2>&1
            fi
            rm -f "${inspect_json}" "${rootfs_tar}"
            set -e

            if (( evidence_code != 0 )); then
              echo "::error::Runtime evidence не подтверждён для ${digest}, код ${evidence_code}"
              printf -- '### Image runtime evidence — `%s`\n\n- Evidence: **ERROR**\n- Проверка завершилась с кодом %s\n\n' \
                "${digest}" "${evidence_code}" >> "${GITHUB_STEP_SUMMARY}"
              failed=1
            else
              printf -- '### Image runtime evidence — `%s`\n\n- Evidence: **PASS**\n- Контейнер не запускался; проверены inspect и exported rootfs exact digest.\n\n' \
                "${digest}" >> "${GITHUB_STEP_SUMMARY}"
            fi

            set +e
            grype "${image_ref}" -o json --file "${raw_report}"
            scan_code=$?
            set -e

            if (( scan_code != 0 )); then
              echo "::error::Техническая ошибка Grype ${scan_code} для ${digest}"
              printf -- '### Image scan policy — %s\n\n- Gate: **ERROR**\n- Grype завершился с кодом %s\n' \
                "${digest}" "${scan_code}" >> "${GITHUB_STEP_SUMMARY}"
              failed=1
              continue
            fi

            set +e
            python scripts/evaluate_image_scan.py \
              --report "${raw_report}" \
              --image-digest "${digest}" \
              --vex-dir security/vex \
              --waivers security/waivers.json \
              --output "${policy_report}" \
              --summary "${policy_summary}"
            policy_code=$?
            set -e

            if [[ -f "${policy_summary}" ]]; then
              cat "${policy_summary}" >> "${GITHUB_STEP_SUMMARY}"
            fi
            if (( policy_code != 0 )); then
              echo "::error::Image policy заблокировала ${digest}, код ${policy_code}"
              failed=1
            fi
          done < "${{ steps.targets.outputs.targets_file }}"
          exit "${failed}"

      # JSON provenance, Grype, policy и runtime evidence сохраняются и при красном gate:
      # это данные для разбора, а не архив удалённых образов. Короткий retention
      # не подменяет историю SBOM.
      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-serving-image-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/grype-reports/
          if-no-files-found: warn
          retention-days: 30
