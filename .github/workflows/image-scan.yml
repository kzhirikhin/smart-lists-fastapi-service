name: Scan deployed Cloud Run images

on:
  # Минуты намеренно не нулевые: GitHub предупреждает, что в начале часа
  # scheduled workflows чаще задерживаются из-за общей нагрузки.
  schedule:
    - cron: '17 3 * * 3'
  workflow_dispatch:
  # После merge policy-only PR проверяем тот же production digest автоматически.
  # Эти пути исключены из deploy.yml, поэтому exact-привязка не устаревает.
  push:
    branches:
      - main
    paths:
      - security/vex/**
      - security/waivers.json
      - scripts/evaluate_image_scan.py
      - .github/workflows/image-scan.yml

permissions:
  contents: read

# Повторный ручной запуск не отменяет уже начавшуюся проверку: иначе можно
# потерять отчёт как раз во время разбора инцидента.
concurrency:
  group: scan-deployed-cloud-run-images
  cancel-in-progress: false

env:
  PROJECT_ID: project-5b7c1bd1-572b-410d-826
  REGION: us-central1
  SERVICE: insights-api
  IMAGE: us-central1-docker.pkg.dev/project-5b7c1bd1-572b-410d-826/smart-lists/insights-api
  SCANNER_SA: github-image-scanner@project-5b7c1bd1-572b-410d-826.iam.gserviceaccount.com
  GRYPE_VERSION: 0.117.0
  # SHA-256 из официального grype_0.117.0_checksums.txt.
  GRYPE_SHA256: 38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26
  GRYPE_DB_AUTO_UPDATE: 'true'
  GRYPE_DB_VALIDATE_AGE: 'true'
  GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 120h
  GRYPE_DB_REQUIRE_UPDATE_CHECK: 'true'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/912709146180/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: ${{ env.SCANNER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Install Grype and require a fresh vulnerability database
        run: |
          archive="${RUNNER_TEMP}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            -o "${archive}"
          echo "${GRYPE_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "${archive}" -C /usr/local/bin grype
          grype db update
          grype db status

      # Источник истины — статус Cloud Run, а не последний тег в реестре.
      # Учитываются ревизии с ненулевым трафиком и tagged revisions: последние
      # доступны по отдельному URL даже при нулевом проценте общего трафика.
      - name: Resolve serving image digests
        id: targets
        run: |
          set -euo pipefail
          reports_dir="${RUNNER_TEMP}/grype-reports"
          mkdir -p "${reports_dir}"

          service_json="${RUNNER_TEMP}/cloud-run-service.json"
          gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json > "${service_json}"

          latest_ready="$(jq -r '.status.latestReadyRevisionName // empty' "${service_json}")"
          mapfile -t revisions < <(
            jq -r --arg latest "${latest_ready}" '
              (.status.traffic // [])[]
              | select(((.percent // 0) > 0) or (.tag != null))
              | if .revisionName then .revisionName
                elif .latestRevision == true then $latest
                else empty
                end
            ' "${service_json}" | sed '/^$/d' | sort -u
          )

          if (( ${#revisions[@]} == 0 )); then
            echo "::error::Cloud Run не вернул ни одной обслуживающей ревизии"
            exit 1
          fi

          targets_file="${RUNNER_TEMP}/cloud-run-image-targets.txt"
          : > "${targets_file}"
          for revision in "${revisions[@]}"; do
            image_ref="$(gcloud run revisions describe "${revision}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --format='value(spec.containers[0].image)')"
            prefix="${IMAGE}@sha256:"
            digest="${image_ref#"${prefix}"}"
            if [[ "${image_ref}" != "${prefix}"* || ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Ревизия ${revision} указывает не на ожидаемый immutable digest: ${image_ref}"
              exit 1
            fi
            printf '%s\n' "${image_ref}" >> "${targets_file}"
          done

          sort -u -o "${targets_file}" "${targets_file}"
          if [[ ! -s "${targets_file}" ]]; then
            echo "::error::Список image digest оказался пустым"
            exit 1
          fi
          echo "targets_file=${targets_file}" >> "${GITHUB_OUTPUT}"
          echo "reports_dir=${reports_dir}" >> "${GITHUB_OUTPUT}"

      # Проверяем все обслуживающие digest, даже если первый уже уязвим.
      # Grype без `--fail-on` отличает техническую ошибку от результата, а
      # отдельный policy evaluator применяет только exact VEX/waiver и решает
      # high/critical gate. Техническую ошибку политика подавить не может.
      - name: Scan every serving digest
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r image_ref; do
            digest="${image_ref##*@}"
            report_prefix="${{ steps.targets.outputs.reports_dir }}/grype-${digest#sha256:}"
            raw_report="${report_prefix}-raw.json"
            policy_report="${report_prefix}-policy.json"
            policy_summary="${report_prefix}-summary.md"

            set +e
            grype "${image_ref}" -o json --file "${raw_report}"
            scan_code=$?
            set -e

            if (( scan_code != 0 )); then
              echo "::error::Техническая ошибка Grype ${scan_code} для ${digest}"
              printf -- '### Image scan policy — %s\n\n- Gate: **ERROR**\n- Grype завершился с кодом %s\n' \
                "${digest}" "${scan_code}" >> "${GITHUB_STEP_SUMMARY}"
              failed=1
              continue
            fi

            set +e
            python scripts/evaluate_image_scan.py \
              --report "${raw_report}" \
              --image-digest "${digest}" \
              --vex-dir security/vex \
              --waivers security/waivers.json \
              --output "${policy_report}" \
              --summary "${policy_summary}"
            policy_code=$?
            set -e

            if [[ -f "${policy_summary}" ]]; then
              cat "${policy_summary}" >> "${GITHUB_STEP_SUMMARY}"
            fi
            if (( policy_code != 0 )); then
              echo "::error::Image policy заблокировала ${digest}, код ${policy_code}"
              failed=1
            fi
          done < "${{ steps.targets.outputs.targets_file }}"
          exit "${failed}"

      # JSON сохраняется и при красном gate: это данные для разбора, а не
      # архив удалённых образов. Короткий retention не подменяет историю SBOM.
      - name: Upload Grype reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-serving-image-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/grype-reports/
          if-no-files-found: warn
          retention-days: 30
