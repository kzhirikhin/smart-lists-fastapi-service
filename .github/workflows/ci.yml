name: CI

# Проверки для каждой ветки и каждого PR. Ничего не деплоит.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий незавершённый прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # Первое условие: push в main уже гоняет тесты в deploy.yml как гейт перед
    # выкладкой — второй раз здесь не нужен.
    # Второе: ветка внутри репозитория покрыта событием push, поэтому её PR дал
    # бы второй прогон того же коммита. Остаются только PR из форков.
    if: >-
      (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository)

    # Заведомо нерабочие значения — см. комментарий в deploy.yml.
    env:
      EXPECTED_CALLER_SA: test-caller@example.iam.gserviceaccount.com
      SERVICE_AUDIENCE: https://insights-api.example.run.app
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_test
      ANTHROPIC_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000000
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_test
      ANTHROPIC_WORKSPACE_ID: wrkspc_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Версия должна совпадать с Python в production-образе из Dockerfile.
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # Секреты в истории. Дублирует secret scanning GitHub, но с другой стороны:
  # тот знает шаблоны известных провайдеров, а gitleaks ловит и generic-строки
  # вроде приватных ключей и строк подключения. Репозиторий публичный, поэтому
  # проверка нужна и на PR со стороны.
  secrets:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Вся история, а не последний коммит: секрет, добавленный и удалённый
          # внутри одной ветки, остаётся в промежуточных коммитах.
          fetch-depth: 0

      # Бинарь официального релиза вместо стороннего action: перед распаковкой
      # проверяем явно закреплённые версию и SHA-256.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "${archive}" -C /usr/local/bin gitleaks

      # --redact: найденное значение не печатается в лог.
      - name: Scan history
        run: gitleaks git --redact --verbose .
