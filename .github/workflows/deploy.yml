name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

# Токен по умолчанию только на чтение; job deploy добирает id-token сама.
permissions:
  contents: read

# Две выкладки одновременно не гоняем, но начатую не отменяем.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: project-5b7c1bd1-572b-410d-826
  REGION: us-central1
  SERVICE: insights-api
  IMAGE: us-central1-docker.pkg.dev/project-5b7c1bd1-572b-410d-826/smart-lists/insights-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Версия должна совпадать с Python в production-образе из Dockerfile.
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Заведомо нерабочие значения. Нужны только чтобы прошла валидация
      # Settings при импорте приложения: до сети тесты не доходят — клиент
      # Anthropic замокан, а settings подменяется фикстурой в conftest.py.
      - name: Run tests
        run: pytest
        env:
          ANTHROPIC_API_KEY: test-key
          SERVICE_SECRET: test-secret-123

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Environment фиксирует production deployment и разрешает его только из main.
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/912709146180/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@project-5b7c1bd1-572b-410d-826.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet
