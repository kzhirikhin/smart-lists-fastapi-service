name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    # Policy-only изменение должно переоценить тот же production digest, а не
    # создать новый образ, к которому exact VEX/waiver уже не относится.
    paths-ignore:
      - PROJECT_MEMORY.md
      - security/SBOM_RUNBOOK.md
      - security/vex/**
      - security/waivers.json
      - scripts/evaluate_image_scan.py
      - .github/workflows/image-scan.yml
      - tests/test_scan_policy.py
      - tests/test_supply_chain.py

# Токен по умолчанию только на чтение; job deploy добирает id-token сама.
permissions:
  contents: read

# Две выкладки одновременно не гоняем, но начатую не отменяем.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: project-5b7c1bd1-572b-410d-826
  REGION: us-central1
  REPOSITORY: smart-lists
  SERVICE: insights-api
  IMAGE: us-central1-docker.pkg.dev/project-5b7c1bd1-572b-410d-826/smart-lists/insights-api
  RUNTIME_SA: insights-api-runtime@project-5b7c1bd1-572b-410d-826.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Версия должна совпадать с Python в production-образе из Dockerfile.
          python-version: '3.13'

      # requirements-dev.txt — надмножество runtime-набора: он собран из
      # requirements.in плюс инструментарий тестов. Production-образ ставит
      # только requirements.txt.
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-dev.txt

      # Заведомо нерабочие значения. Нужны только чтобы прошла валидация
      # Settings при импорте приложения: до сети тесты не доходят — клиент
      # Anthropic замокан, а settings подменяется фикстурой в conftest.py.
      - name: Run tests
        run: pytest
        env:
          EXPECTED_CALLER_SA: test-caller@example.iam.gserviceaccount.com
          SERVICE_AUDIENCE: https://insights-api.example.run.app
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_test
          ANTHROPIC_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000000
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_test
          ANTHROPIC_WORKSPACE_ID: wrkspc_test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Environment фиксирует production deployment и разрешает его только из main.
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/912709146180/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@project-5b7c1bd1-572b-410d-826.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # Тег по SHA коммита остаётся — он нужен человеку, чтобы связать образ с
      # исходником. Тег `latest` убран: он мутабельный, его никто не потреблял,
      # а выкладка идёт по digest.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # SBOM строится по immutable digest уже опубликованного образа, а не по
      # рабочей директории или тегу. Поэтому опись включает и Python-пакеты, и
      # системные пакеты финального Debian-слоя — ровно те байты, которые могут
      # уехать в Cloud Run. Ошибка генерации, проверки или attachment останавливает
      # deploy: образ без связанной с ним описи не считается готовым артефактом.
      #
      # Имя attachment детерминировано digest. Повторный запуск того же build не
      # плодит копии; существующая запись принимается только с ожидаемыми target
      # и media type. Отдельного архива нет: cleanup удалит attachment вместе с
      # target image, что является принятым сроком хранения для этого проекта.
      - name: Generate and attach CycloneDX SBOM
        env:
          SYFT_VERSION: 1.51.0
          # SHA-256 из официального syft_1.51.0_checksums.txt.
          SYFT_SHA256: 2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f
          DIGEST: ${{ steps.build.outputs.digest }}
          ATTACHMENT_TYPE: application/vnd.cyclonedx+json
        run: |
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Build returned an invalid digest: ${DIGEST}" >&2
            exit 1
          }

          archive="${RUNNER_TEMP}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            -o "${archive}"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "${archive}" -C /usr/local/bin syft

          digest_hex="${DIGEST#sha256:}"
          sbom="${RUNNER_TEMP}/insights-api-${digest_hex}.cdx.json"
          syft "${IMAGE}@${DIGEST}" -o "cyclonedx-json@1.6=${sbom}"

          jq -e \
            --arg digest "${DIGEST}" \
            --arg syft_version "${SYFT_VERSION}" \
            '
              .bomFormat == "CycloneDX" and
              .specVersion == "1.6" and
              .metadata.component.type == "container" and
              .metadata.component.version == $digest and
              any(.metadata.tools.components[]?;
                .name == "syft" and .version == $syft_version) and
              ((.components | type) == "array") and
              ((.components | length) > 0)
            ' "${sbom}" >/dev/null

          image_name="${IMAGE##*/}"
          target="$(
            gcloud artifacts versions describe "${DIGEST}" \
              --project "${PROJECT_ID}" \
              --location "${REGION}" \
              --repository "${REPOSITORY}" \
              --package "${image_name}" \
              --format='value(name)'
          )"
          expected_target="projects/${PROJECT_ID}/locations/${REGION}/repositories/${REPOSITORY}/packages/${image_name}/versions/${DIGEST}"
          [[ "${target}" == "${expected_target}" ]] || {
            echo "Artifact Registry returned an unexpected target: ${target}" >&2
            exit 1
          }

          attachment_id="cyclonedx-${digest_hex:0:48}"
          attachment="${RUNNER_TEMP}/attachment.json"
          if gcloud artifacts attachments describe "${attachment_id}" \
            --project "${PROJECT_ID}" \
            --location "${REGION}" \
            --repository "${REPOSITORY}" \
            --format=json >"${attachment}" 2>/dev/null; then
            echo "Attachment ${attachment_id} already exists; validating it."
          else
            gcloud artifacts attachments create "${attachment_id}" \
              --project "${PROJECT_ID}" \
              --location "${REGION}" \
              --repository "${REPOSITORY}" \
              --target "${target}" \
              --attachment-type "${ATTACHMENT_TYPE}" \
              --attachment-namespace "anchore.com/syft" \
              --files "${sbom}" \
              --format=json >"${attachment}"
          fi

          jq -e \
            --arg target "${target}" \
            --arg type "${ATTACHMENT_TYPE}" \
            '
              .target == $target and
              .type == $type and
              .attachmentNamespace == "anchore.com/syft" and
              ((.files | type) == "array") and
              ((.files | length) == 1)
            ' "${attachment}" >/dev/null

      # Сканер намеренно не блокирует выкладку. На 2026-08-20 в образе два
      # critical и два high, и все четыре — `perl-base` базового Debian со
      # статусом `not fixed`: гейт по severity останавливал бы каждый деплой,
      # не давая ни одного действия, которое можно предпринять, и через месяц
      # оброс бы ignore-правилами. Ценность шага в дельте: строка, которой
      # вчера не было, видна в логе рядом с выкладкой, которая её принесла.
      # `--only-fixed` оставляет лишь то, что вообще чинится обновлением.
      - name: Scan image for known vulnerabilities
        continue-on-error: true
        env:
          GRYPE_VERSION: 0.117.0
          # SHA-256 из официального grype_0.117.0_checksums.txt.
          GRYPE_SHA256: 38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          archive="${RUNNER_TEMP}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            -o "${archive}"
          echo "${GRYPE_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "${archive}" -C /usr/local/bin grype
          grype "${IMAGE}@${DIGEST}" --only-fixed -o table

      # Выкладка по digest, а не по тегу: тег — это имя, которое в реестре
      # можно переставить на другое содержимое, digest адресует сами байты.
      # Ровно тот образ, который собрала и просканировала эта job.
      #
      # Личность указана явно, хотя `gcloud run deploy` и сохранил бы текущую.
      # Умолчание здесь — дефолтный compute service account проекта, общий для
      # всего проекта: пересоздание сервиса без этой строки тихо вернуло бы
      # сервис на него, и правило федерации Anthropic перестало бы совпадать.
      #
      # `--port` по той же причине: контейнер слушает 8000, а умолчание Cloud
      # Run — 8080. Сейчас порт держится состоянием сервиса, и пересоздание с
      # нуля молча получило бы ревизию, которая не отвечает.
      - name: Deploy to Cloud Run
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${IMAGE}@${DIGEST}" \
            --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SA }} \
            --port 8000 \
            --quiet
